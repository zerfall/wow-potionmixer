name: Test and release

# Every push and pull request runs the syntax checks and the test harness.
# Pushing a tag (for example 1.3.0) also packages the addon with
# BigWigsMods/packager and uploads it to GitHub Releases, plus CurseForge,
# Wago and WoWInterface wherever the .toc has the site's project ID and the
# repository has the site's token as a secret. See "Releasing" in README.md.
on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Lua 5.1, LuaJIT and xmllint
        run: sudo apt-get update && sudo apt-get install -y lua5.1 luajit libxml2-utils

      - name: Check syntax
        run: |
          for f in PotionMixer/*.lua; do luac5.1 -p "$f"; done
          xmllint --noout PotionMixer/Bindings.xml

      - name: Run the test harness (Lua 5.1)
        run: lua5.1 tests/harness.lua

      - name: Run the test harness (LuaJIT)
        run: luajit tests/harness.lua

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }} # provided by GitHub, no secret to add
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: the changelog lists the commits since the previous tag

      - name: Package and upload
        uses: BigWigsMods/packager@v2
