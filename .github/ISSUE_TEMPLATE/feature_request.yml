name: Feature request
description: Suggest something new or a change to how Potion Mixer works.
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like Potion Mixer to do?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: When would it help you?
      description: The situation in the game where you'd use it, for example "When I level an alt, I want …"
